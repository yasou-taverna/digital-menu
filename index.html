
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>מפת שולחנות – YASOU</title>
<style>
  :root{
    --navy: #163a5c;
    --navy-dark: #0d2438;
    --gold: #2f74ab;
    --gold-light: #5a9bcf;
    --cream: #eef2f6;
    --danger: #c0473a;
    --paper: #ffffff;
    --ink: #22303f;
    --muted: #6b7787;
    --line: #e3ddcd;
    --zone-outdoor: #e7f0e2;
    --zone-covered: #e2ecf5;
    --zone-indoor: #f8ecd6;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .topbar {
    background: linear-gradient(180deg, #4f8fc4 0%, var(--navy-dark) 100%);
    color: #fff;
    padding: 16px; text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  .topbar h1 { margin: 0; font-size: 19px; }
  .topbar .sub { font-size: 13px; color: #cfd9e3; margin-top: 3px; }

  .zone {
    padding: 22px 50px 26px;
    border-bottom: 1px solid var(--line);
  }
  .zone.outdoor { background: var(--zone-outdoor); }
  .zone.covered { background: var(--zone-covered); }
  .zone.indoor  { background: var(--zone-indoor); }

  .zone h2 {
    text-align: center;
    font-size: 20px; margin: 0 0 18px;
    color: var(--navy);
  }

  .zone-canvas {
    position: relative;
    max-width: 1000px;
    margin: 0 auto;
  }
  .table-btn {
    --status: #2f74ab;
    position: absolute;
    width: calc(var(--w) * 1px);
    height: calc(var(--h) * 1px);
    transform: translate(-50%, -50%);
    border: 3px solid #0d3a57;
    background: color-mix(in srgb, var(--status), white 58%);
    border-radius: 7px;
    color: #151515;
    font-weight: 900;
    font-size: 1.35rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), 0 8px 18px rgba(0,0,0,.11);
    transition: transform .08s ease;
  }
  .table-btn.round { border-radius: 50%; }
  .table-btn:active { transform: translate(-50%, -50%) scale(.94); }
  .table-btn::before {
    content: attr(data-number);
    position: absolute;
    top: 50%;
    right: calc(100% + 10px);
    transform: translateY(-50%);
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #f8fbff;
    border: 2px solid #24475a;
    color: #e10f1c;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 900;
  }

  .legend {
    text-align: center; padding: 14px 16px 30px;
    font-size: 13px; color: var(--muted);
  }
</style>
</head>
<body>

  <div class="topbar">
    <h1>מפת שולחנות – YASOU</h1>
    <div class="sub">בחר שולחן כדי לפתוח הזמנה חדשה</div>
  </div>

  <div class="zone outdoor">
    <h2>מתחם חיצוני</h2>
    <div class="zone-canvas" id="zone-outdoor" style="height:260px;"></div>
  </div>

  <div class="zone covered">
    <h2>מתחם מקורה</h2>
    <div class="zone-canvas" id="zone-covered" style="height:380px;"></div>
  </div>

  <div class="zone indoor">
    <h2>מתחם פנימי</h2>
    <div class="zone-canvas" id="zone-indoor" style="height:340px;"></div>
  </div>

  <div class="legend">לחיצה על שולחן פותחת את מסך ההזמנה עבורו</div>

<script>
  // בלופרינט מדויק מהדשבורד הקיים - x/y באחוזים, w/h בפיקסלים
  const tableBlueprint = [
    { id: 1, seats: 4, zone: "inside", x: 10, y: 80, w: 74, h: 58 },
    { id: 2, seats: 4, zone: "inside", x: 10, y: 58, w: 74, h: 58 },
    { id: 3, seats: 4, zone: "inside", x: 10, y: 36, w: 74, h: 58 },
    { id: 4, seats: 4, zone: "inside", x: 10, y: 14, w: 74, h: 58 },
    { id: 5, seats: 4, zone: "inside", x: 34, y: 58, w: 74, h: 58 },
    { id: 6, seats: 4, zone: "inside", x: 34, y: 36, w: 74, h: 58 },
    { id: 7, seats: 6, zone: "inside", x: 34, y: 15, w: 112, h: 54 },
    { id: 8, seats: 2, zone: "inside", x: 56, y: 58, w: 58, h: 58 },
    { id: 9, seats: 4, zone: "inside", x: 56, y: 36, w: 74, h: 58 },
    { id: 10, seats: 4, zone: "inside", x: 56, y: 14, w: 74, h: 58 },
    { id: 11, seats: 4, zone: "inside", x: 78, y: 80, w: 74, h: 58 },
    { id: 12, seats: 4, zone: "inside", x: 78, y: 58, w: 74, h: 58 },
    { id: 13, seats: 4, zone: "inside", x: 78, y: 36, w: 74, h: 58 },
    { id: 14, seats: 4, zone: "inside", x: 78, y: 14, w: 74, h: 58 },
    { id: 15, seats: 2, zone: "inside", x: 94, y: 58, w: 58, h: 58 },
    { id: 16, seats: 2, zone: "inside", x: 94, y: 36, w: 58, h: 58 },
    { id: 17, seats: 2, zone: "inside", x: 94, y: 14, w: 58, h: 58 },
    { id: 18, seats: 6, zone: "covered", x: 11, y: 62, w: 90, h: 70 },
    { id: 19, seats: 10, zone: "covered", x: 50, y: 63, w: 132, h: 132, round: true },
    { id: 20, seats: 6, zone: "covered", x: 89, y: 62, w: 90, h: 70 },
    { id: 21, seats: 8, zone: "covered", x: 13, y: 25, w: 142, h: 62 },
    { id: 22, seats: 12, zone: "covered", x: 34, y: 25, w: 190, h: 62 },
    { id: 23, seats: 12, zone: "covered", x: 66, y: 25, w: 190, h: 62 },
    { id: 24, seats: 8, zone: "covered", x: 87, y: 25, w: 142, h: 62 },
    { id: 25, seats: 6, zone: "outside", x: 10, y: 28, w: 100, h: 60 },
    { id: 26, seats: 6, zone: "outside", x: 27, y: 28, w: 100, h: 60 },
    { id: 27, seats: 6, zone: "outside", x: 10, y: 74, w: 100, h: 60 },
    { id: 28, seats: 6, zone: "outside", x: 27, y: 74, w: 100, h: 60 },
    { id: 29, seats: 6, zone: "outside", x: 50, y: 28, w: 100, h: 60 },
    { id: 30, seats: 6, zone: "outside", x: 50, y: 74, w: 100, h: 60 },
    { id: 31, seats: 6, zone: "outside", x: 73, y: 28, w: 100, h: 60 },
    { id: 32, seats: 6, zone: "outside", x: 90, y: 28, w: 100, h: 60 },
    { id: 33, seats: 6, zone: "outside", x: 73, y: 74, w: 100, h: 60 },
    { id: 34, seats: 6, zone: "outside", x: 90, y: 74, w: 100, h: 60 },
  ];

  const ZONE_TO_CONTAINER = {
    outside: "zone-outdoor",
    covered: "zone-covered",
    inside: "zone-indoor"
  };

  tableBlueprint.forEach(t => {
    const container = document.getElementById(ZONE_TO_CONTAINER[t.zone]);
    const btn = document.createElement("button");
    btn.className = "table-btn free" + (t.round ? " round" : "");
    btn.style.left = t.x + "%";
    btn.style.top = t.y + "%";
    btn.style.setProperty("--w", t.w);
    btn.style.setProperty("--h", t.h);
    btn.dataset.number = t.id;
    btn.title = `שולחן ${t.id}, ${t.seats} מקומות`;
    btn.textContent = t.seats;
    btn.onclick = () => { location.href = "order.html?table=" + t.id; };
    container.appendChild(btn);
  });
</script>

</body>
</html>
